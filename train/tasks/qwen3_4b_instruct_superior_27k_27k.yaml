### model
# Qwen3-4B-Instruct PLE initialized model
model_name_or_path: ./models/qwen3_4b_instruct_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# Qwen3-4B-Instruct PLE has ~5.8B parameters (4B base + ~1.8B extra for the second MLP expert),
# ZeRO-2 is enough on 2x H200
# ZeRO-3 is incompatible with PLE's conditional routing (different ranks take different experts,
# so the submodule execution order differs across ranks); use ZeRO-2
# Must use ZeRO-2 (it only shards gradients and optimizer states, so parameter access order need not match across ranks)
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json
gradient_checkpointing: true

### dataset
dataset_dir: train/data
dataset: superior_reasoning_27k_27k
# Qwen3 uses the qwen3 template (not qwen25 as for Qwen2.5)
template: qwen3
cutoff_len: 32768
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
default_system: ""


### output
output_dir: train/saves/qwen3_4b_instruct_superior_27k_27k
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: Qwen3-4B-Instruct-PLE_superior_27k_27k

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 24
# Effective batch size = 1 × 24 × 2 GPU = 48
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null


