### model
# Qwen3-4B-Instruct PLE initialized model
model_name_or_path: ./models/qwen3_4b_instruct_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# Qwen3-4B-Instruct PLE has ~5.8B parameters (4B base + ~1.8B extra for the second MLP expert),
# ZeRO-2 is enough on 4x A100-80GB; switch to ZeRO-3 if out of memory
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: train/data
dataset: naive-mix_20k
# Qwen3 uses the qwen3 template (not qwen25 as for Qwen2.5)
template: qwen3
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
default_system: ""


### output
output_dir: train/saves/qwen3_4b_instruct_20k_a100
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: Qwen3-4B-Instruct-PLE_20k_a100

### train
# A 4B model is much smaller than 7B, so a larger batch size is possible
per_device_train_batch_size: 1
gradient_accumulation_steps: 12
# Effective batch size = 1 × 12 × 4 GPU = 48
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
