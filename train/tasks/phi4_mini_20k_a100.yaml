### model
# Phi-4-mini PLE initialized model
model_name_or_path: ./models/phi4_mini_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# PLE requires ZeRO-2 (ZeRO-3 is incompatible with conditional routing)
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: train/data
dataset: naive-mix_20k
template: phi4_mini
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
default_system: ""


### output
output_dir: train/saves/phi4_mini_20k_a100
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: Phi-4-mini-PLE_20k_a100

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 12
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null


