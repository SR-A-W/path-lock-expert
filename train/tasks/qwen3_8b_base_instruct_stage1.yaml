# Experiment goal: Track A2 Stage 1 — Instruct SFT on Qwen3-8B-Base (non PLE)
# Design & Settings:
# 1. Model: Qwen3-8B-Base (original, NOT PLE)
# 2. Training Mode: General instruct SFT to acquire instruction-following ability
# 3. Dataset: alpaca_gpt4_en (~52k GPT-4 generated instruct data, auto-downloaded from HuggingFace)
# 4. System prompt: empty string
# 5. Output: "homemade Instruct" model (no CoT contamination), to be converted to PLE for Stage 2


### model
# NOTE:----------Double check this one!----------
model_name_or_path: Qwen/Qwen3-8B-Base

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# 8B 模型需要 DeepSpeed，使用 ZeRO-3
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
# NOTE:----------Double check this one!----------
dataset_dir: train/data
dataset: alpaca_gpt4_en
# NOTE:----------Double check this one!----------
template: qwen3
cutoff_len: 4096
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
# NOTE:----------Double check this one!----------
default_system: ""


### output
# NOTE:----------Double check this one!----------
output_dir: train/saves/qwen3_8b_base_instruct_stage1
save_only_model: true
logging_steps: 1
# NOTE:----------Double check this one!----------
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
# NOTE:----------Double check this one!----------
run_name: Qwen3-8B-Base-Instruct-Stage1

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 12
# 有效 batch size = 1 × 12 × 2 GPU = 24
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null


