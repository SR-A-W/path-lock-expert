### model
# LLaMA 3.1-8B-Instruct PLE 初始化模型（本地路径）
# NOTE:----------Double check this one!----------
model_name_or_path: ./models/llama_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# ZeRO-3 不兼容 PLE 的条件路由（不同 rank 走不同 expert 导致 submodule 执行顺序不一致）
# 必须使用 ZeRO-2（仅分片梯度和优化器状态，不要求参数访问顺序一致）
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
# NOTE:----------Double check this one!----------
dataset_dir: train/data
dataset: naive-mix_140k
# NOTE:----------Double check this one!----------
# LLaMA 3.1 使用 llama3 template
template: llama3
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
# NOTE: dataloader_num_workers=4 may cause "Bus error" on partitions with small /dev/shm.
# Reduce to 2 if you see data-loader crashes during the first few steps.
dataloader_num_workers: 2
# NOTE:----------Double check this one!----------
default_system: ""


### output
# NOTE:----------Double check this one!----------
output_dir: train/saves/llama3_8b_140k
save_only_model: true
logging_steps: 1
# NOTE:----------Double check this one!----------
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
# NOTE:----------Double check this one!----------
run_name: LLaMA3-8B-PLE_140k

### train
# PLE 路由是序列级的，batch 内混合路由会导致 loss=0, grad_norm=nan
# 必须 per_device_train_batch_size=1
per_device_train_batch_size: 1
# 有效 batch size = 1 × 12 × 4 GPU = 48（与 Qwen2.5-7B 一致）
gradient_accumulation_steps: 12
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
# flash_attn: fa2


