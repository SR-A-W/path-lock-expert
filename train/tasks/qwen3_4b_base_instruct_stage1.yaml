### model
# Note: this is the original Base model, not PLE.
# Goal: give the Base model instruction-following ability, producing a "homemade Instruct" model (no CoT contamination)
model_name_or_path: ./models/source/Qwen/Qwen3-4B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# 4B model + 52k short samples fit on a single GPU; DeepSpeed is not needed
# deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
# General instruct dataset, downloaded from HuggingFace automatically by LLaMA-Factory
# alpaca_gpt4_en: high-quality GPT-4-generated instruction data (~52k samples)
dataset_dir: train/data
dataset: alpaca_gpt4_en
template: qwen3
cutoff_len: 4096              # instruct data is short, 16k is not needed
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
default_system: ""


### output
output_dir: train/saves/qwen3_4b_base_instruct_stage1
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: Qwen3-4B-Base-Instruct-Stage1

### train
# Single GPU, 4B model, so a larger batch is possible
per_device_train_batch_size: 4
gradient_accumulation_steps: 6
# Effective batch size = 4 × 6 × 1 GPU = 24
# A Base model tolerates a slightly higher learning rate
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
