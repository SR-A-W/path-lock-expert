# Experiment goal: Baseline — vanilla hybrid-thinking SFT on Qwen3-4B-Instruct-2507 (no PLE)
# Method: Single-phase mix training (Hybrid Thinking ACL2026 paper)
# Design & Settings:
# 1. Model: Qwen3-4B-Instruct-2507 (original, NOT PLE)
# 2. Training Mode: Single-phase, directly mix think + no_think data
# 3. Dataset: naive-mix_140k (full mixed think + no_think, ~140k samples, ratio ~1:1)
# 4. System prompt: empty string


### model
# NOTE:----------Double check this one!----------
model_name_or_path: ./models/source/Qwen/Qwen3-4B-Instruct-2507

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# 非 PLE，无条件路由限制，可使用 ZeRO-3
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
# NOTE:----------Double check this one!----------
dataset_dir: train/data
dataset: naive-mix_140k
# NOTE:----------Double check this one!----------
template: qwen3
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
# NOTE:----------Double check this one!----------
default_system: ""


### output
# NOTE:----------Double check this one!----------
output_dir: train/saves/baselines/qwen3_4b_instruct_mix_140k
save_only_model: true
logging_steps: 1
# NOTE:----------Double check this one!----------
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
# NOTE:----------Double check this one!----------
run_name: baseline_Qwen3-4B-Instruct_mix_140k

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 12
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null


