# Settings:
# 1. Model: Qwen3-4B-Instruct-2507 (original, NOT PLE)
# 2. Training Mode: Single-phase, directly mix think + no_think data
# 3. Dataset: naive-mix_140k (~140k samples)
# 4. System prompt: empty string


### model
model_name_or_path: ./models/source/Qwen/Qwen3-4B-Instruct-2507

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset_dir: train/data
dataset: naive-mix_140k
template: qwen3
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
default_system: ""


### output
output_dir: train/saves/baselines/qwen3_4b_instruct_mix_140k_a100
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
run_name: baseline_Qwen3-4B-Instruct_mix_140k_a100

### train
per_device_train_batch_size: 1
# Effective batch size = 1 × 6 × 4 GPU = 24
gradient_accumulation_steps: 6
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null


### eval
