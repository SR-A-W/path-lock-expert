### model
# LLaMA 3.1-8B-Instruct PLE initialized model (local path)
model_name_or_path: ./models/llama_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# ZeRO-3 is incompatible with PLE's conditional routing; use ZeRO-2
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: train/data
dataset: superior_reasoning_27k_27k
template: llama3
cutoff_len: 32768
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
default_system: ""


### output
output_dir: train/saves/llama3_8b_superior_27k_27k
save_only_model: true
logging_steps: 1
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: LLaMA3-8B-PLE_superior_27k_27k

### train
# PLE routing is per-sequence, so the per-device batch size must be 1
per_device_train_batch_size: 1
# Effective batch size = 1 × 12 × 4 GPU = 48
gradient_accumulation_steps: 12
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null


