### model
# Qwen3-4B-Base PLE 初始化模型（Track A1: 直接PLE SFT，140k完整训练）
# NOTE:----------Double check this one!----------
model_name_or_path: ./models/qwen3_4b_base_ple_initialized
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# ZeRO-3 不兼容 PLE 的条件路由，必须使用 ZeRO-2
deepspeed: train/LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
# NOTE:----------Double check this one!----------
dataset_dir: train/data
dataset: naive-mix_140k
# NOTE:----------Double check this one!----------
template: qwen3
cutoff_len: 16384
max_samples: 100000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2
# NOTE:----------Double check this one!----------
default_system: ""


### output
# NOTE:----------Double check this one!----------
output_dir: train/saves/qwen3_4b_base_140k
save_only_model: true
logging_steps: 1
# NOTE:----------Double check this one!----------
save_steps: 5000
plot_loss: true
overwrite_output_dir: false
report_to: wandb
# NOTE:----------Double check this one!----------
run_name: Qwen3-4B-Base-PLE_140k

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 24
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
# flash_attn: fa2


